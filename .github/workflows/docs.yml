name: Build docs website

# Build the documentation for new tags
on:
  push:
     tags:
       - '*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv - latest if not defined in `pyproject.toml`
        # Action version does not determine which uv version to install
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup Python
        # Faster than using uv, as it caches Python on GitHub runner
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'

      - name: Generate HTML docs with pdoc
        run: uv run pdoc a3_antistasi_ultimate_save_data_parser -o docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
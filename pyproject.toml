[project]
name = "a3-antistasi-ultimate-save-data-parser"
version = "0.4.0"
description = "Parse Antistasi Ultimate JSON save data"
readme = "README.md"
authors = [
    { name = "recreational-projects", email = "205627218+recreational-projects@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.22.0",
]

[project.urls]
Documentation = "https://recreational-projects.github.io/A3-Antistasi-Ultimate-save-data-parser/"
Repository = "https://github.com/recreational-projects/A3-Antistasi-Ultimate-save-data-parser"
Changelog = "https://github.com/recreational-projects/A3-antistasi-Ultimate-save-data-parser/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]
ignore = [
    # Rules that conflict with Ruff formatter:
    "COM812",  # missing-trailing-comma
    # Ruff format choices:
    "D203",  # incorrect-blank-line-before-class
    "D213",  # multi-line-summary-second-line
    # Other:
    "N802",  # invalid-function-name: keep refs to member names formatted as source
    "CPY001",  # missing-copyright-notice
    "DTZ001",  # call-datetime-without-tzinfo
    "ERA001",  # commented-out-code
]
extend-safe-fixes = [
#    "TC",  # flake8-type-checking
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["msgspec.Struct"]

[tool.ruff.lint.per-file-ignores]
"src/a3_antistasi_ultimate_save_data_parser/*.py" = [
    "N815",  # mixed-case-variable-in-class-scope: keep refs to member names formatted as source
]
"tests/*" = [
    "ANN401",  # any-type
    "D205",  # missing-blank-line-after-summary
    "PLR2004",  # magic-value-comparison
    "S101",  # assert
    "SLF001",  # private-member-access
]
"scripts/*.py" = [
    "T201",  # flake8-print
]